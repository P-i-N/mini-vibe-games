<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b3a67">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Trestle Trouble</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="card"><div id="lvName"></div><div id="veh"></div></div>
  <div class="card money"><div id="cost"></div><div class="meter"><div id="costFill"></div></div><div id="best"></div></div>
</div>
<button id="pauseBtn" aria-label="Pause">II</button>
<div id="bar">
  <div class="group">
    <button class="tool" data-tool="road"><i class="sw road"></i>Road</button>
    <button class="tool" data-tool="wood"><i class="sw wood"></i>Wood</button>
    <button class="tool" data-tool="steel"><i class="sw steel"></i>Steel</button>
    <button class="tool" data-tool="cable"><i class="sw cable"></i>Cable</button>
    <button class="tool" data-tool="erase"><i class="sw erase">✕</i>Erase</button>
  </div>
  <div id="toolInfo"></div>
  <div class="group">
    <button id="undoBtn">↶ Undo</button>
    <button id="clearBtn">Clear</button>
    <button id="slowBtn">Slow-mo</button>
    <button id="stopBtn" class="stop">■ Build</button>
    <button id="goBtn" class="go">GO ▶</button>
  </div>
</div>
<div id="tip"></div>
<div id="toast"></div>
<div id="overlay"></div>
<script src="levels.js?v=1"></script>
<script src="game.js?v=1"></script>
</body>
</html>

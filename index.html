<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d1a">
<title>Mini Vibe Games</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; background: #0b0d1a; color: #e8ecff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 2rem; margin: 0 0 4px; }
  p { color: #9aa3d6; margin: 0 0 24px; }
  a.game { display: flex; gap: 16px; align-items: center; padding: 18px; border-radius: 16px;
    background: #161a36; border: 1px solid #ffffff1a; color: inherit; text-decoration: none; margin-bottom: 12px; }
  a.game:active { transform: scale(0.98); }
  .icon { font-size: 2.6rem; }
  .name { font-weight: 800; font-size: 1.2rem; }
  .desc { color: #a3abd9; font-size: 0.95rem; margin-top: 2px; }
</style>
</head>
<body>
<main>
  <h1>Mini Vibe Games</h1>
  <p>Small games for a phone, a tablet, or a mouse. One hand is enough.</p>
  <a class="game" href="brick-bazaar/">
    <span class="icon">🧱</span>
    <span><span class="name">Brick Bazaar</span>
      <span class="desc" style="display:block">Brick breaker with coins, a shop, guns, magnets and drones.</span></span>
  </a>
</main>
</body>
</html>
